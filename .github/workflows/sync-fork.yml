name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  
      pull-requests: write 

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4

      - name: Sync with Upstream
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@://github.com'
          
          # Replace with your actual parent/upstream repo URL
          git remote add upstream https://github.com/IntentSpider/website-intentspider-webnet
          git fetch upstream
          
          git checkout main
          git merge upstream/main --ff-only || (echo "Conflict detected!" && exit 1)
          
          git push origin main
