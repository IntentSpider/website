<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Viewer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 20px; color: #24292e; background-color: white; margin: 0; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 20px; font-size: 14px; }
        th, td { padding: 8px 12px; border: 1px solid #dfe2e5; text-align: left; }
        th { background-color: #f6f8fa; font-weight: 600; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        #error { color: #d73a49; display: none; padding: 20px; border: 1px solid #d73a49; border-radius: 6px; background-color: #ffeef0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div id="error"></div>
    <div id="content"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileUrl = urlParams.get('file');

        if (!fileUrl) {
            document.getElementById('error').textContent = 'No file specified.';
            document.getElementById('error').style.display = 'block';
        } else {
            Papa.parse(fileUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.errors.length && !results.data.length) {
                        document.getElementById('error').textContent = 'Error parsing CSV.';
                        document.getElementById('error').style.display = 'block';
                        return;
                    }
                    
                    if (results.data.length === 0) {
                        document.getElementById('content').innerHTML = '<p>No data found.</p>';
                        return;
                    }

                    const headers = Object.keys(results.data[0]);
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += `<th>${escapeHtml(h)}</th>`;
                    });
                    html += '</tr></thead><tbody>';

                    results.data.forEach(row => {
                        html += '<tr>';
                        headers.forEach(h => {
                            html += `<td>${escapeHtml(row[h])}</td>`;
                        });
                        html += '</tr>';
                    });
                    
                    html += '</tbody></table>';
                    document.getElementById('content').innerHTML = html;
                },
                error: function(err) {
                    document.getElementById('error').textContent = 'Failed to load file: ' + err.message;
                    document.getElementById('error').style.display = 'block';
                }
            });
        }

        function escapeHtml(unsafe) {
            if (unsafe === null || unsafe === undefined) return '';
            return unsafe
                 .toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
