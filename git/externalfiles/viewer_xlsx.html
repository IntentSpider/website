<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Viewer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 20px; color: #24292e; background-color: white; margin: 0; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 20px; font-size: 14px; }
        th, td { padding: 8px 12px; border: 1px solid #dfe2e5; text-align: left; }
        th { background-color: #f6f8fa; font-weight: 600; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        #error { color: #d73a49; display: none; padding: 20px; border: 1px solid #d73a49; border-radius: 6px; background-color: #ffeef0; }
        .sheet-tab { padding: 8px 16px; margin-right: 5px; cursor: pointer; background: #eee; border: 1px solid #ccc; border-bottom: none; border-radius: 4px 4px 0 0; display: inline-block; }
        .sheet-tab.active { background: white; border-bottom: 1px solid white; font-weight: bold; }
        #tabs { border-bottom: 1px solid #ccc; margin-bottom: 15px; }
    </style>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div id="error"></div>
    <div id="tabs"></div>
    <div id="content"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileUrl = urlParams.get('file');

        if (!fileUrl) {
            showError('No file specified.');
        } else {
            fetch(fileUrl)
                .then(response => {
                    if (!response.ok) throw new Error("HTTP error " + response.status);
                    return response.arrayBuffer();
                })
                .then(data => {
                    const workbook = XLSX.read(data, { type: 'array' });
                    renderTabs(workbook);
                    renderSheet(workbook, workbook.SheetNames[0]);
                })
                .catch(err => {
                    showError('Failed to load file: ' + err.message);
                });
        }

        function renderTabs(workbook) {
            const tabsDiv = document.getElementById('tabs');
            if (workbook.SheetNames.length <= 1) {
                tabsDiv.style.display = 'none';
                return;
            }
            workbook.SheetNames.forEach((name, index) => {
                const tab = document.createElement('div');
                tab.className = 'sheet-tab' + (index === 0 ? ' active' : '');
                tab.textContent = name;
                tab.onclick = () => {
                    document.querySelectorAll('.sheet-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    renderSheet(workbook, name);
                };
                tabsDiv.appendChild(tab);
            });
        }

        function renderSheet(workbook, sheetName) {
            const worksheet = workbook.Sheets[sheetName];
            const html = XLSX.utils.sheet_to_html(worksheet);
            document.getElementById('content').innerHTML = html;
            
            // Fix table styling generated by SheetJS
            const table = document.querySelector('#content table');
            if (table) {
                table.removeAttribute('border');
            }
        }

        function showError(msg) {
            document.getElementById('error').textContent = msg;
            document.getElementById('error').style.display = 'block';
        }
    </script>
</body>
</html>
