<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Research Paper - IntentSpider</title>
    <link rel="shortcut icon" href="./assets/intentspider-logo-webnet-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script type="module">
        import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
        
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

        const url = 'assets/intentspider_paper.pdf';

        const loadingTask = pdfjsLib.getDocument(url);
        loadingTask.promise.then(function(pdf) {
            const container = document.getElementById('pdf-viewer-container');
            const loadingEl = document.querySelector('.pdf-loading');
            if (loadingEl) loadingEl.remove();

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                pdf.getPage(pageNum).then(function(page) {
                    const scale = 1.5;
                    const viewport = page.getViewport({scale: scale});

                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page';
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    container.appendChild(canvas);

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    page.render(renderContext);
                });
            }
        }, function (reason) {
            console.error(reason);
            const container = document.getElementById('pdf-viewer-container');
            container.innerHTML = '<div class="pdf-loading">Sorry. Please reload this page.</div>';
        });
    </script>
</head>
<body>
    <div id="wrap">
        <header>
            <div id="logo">
                <a href="index.html"><img src="assets/873547485784.png" alt="IntentSpider"></a>
            </div>
            <div id="nav-area">
                <div class="stats">
                    
                </div>
                <nav>
                    <a href="index.html">Home</a>
                    <a href="playground.html">Playground</a>
                    <a href="paper.html">Paper</a>
                    <a href="about.html">About</a>
                    <a href="https://github.com/intentspider/intentspider"><img src="/assets/git-icon-logo.svg" width="20px" alt="">Git</a>
                </nav>
            </div>
        </header>

        <main>
            <h1>Version 1.0</h1>
            <p>Explore the mathematical foundations and architectural design of the IntentSpider engine.</p>
            
            <div id="pdf-viewer-container">
                <div class="pdf-loading"><img src="/assets/spinner.gif" width="35px" alt=""></div>
            </div>
        </main>

        <footer>
            &copy; 2025-2026 IntentSpider Webnet. Contact: <a href="/contactform">Contact Form</a>
        </footer>
    </div>
<script src="stats.js"></script></body>
</html>
