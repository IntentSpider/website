<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntentSpider Playground</title>
    <link rel="stylesheet" href="styles.css?v=8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/themes/ui-darkness/jquery-ui.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/virtual-keyboard/1.30.4/css/keyboard.min.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/virtual-keyboard/1.30.4/js/jquery.keyboard.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
</head>
<body>
    <div id="wrap">
        <div id="notification-banner" style="display: none; background: #0031A7; color: #FFFFFF; padding: 10px; margin-bottom: 20px; font-weight: bold; align-items: center; justify-content: flex-start;">
            <img src="assets/static/info-icon.png" alt="Info" style="width: 25px; height: auto; margin-right: 10px;">
            <span id="notification-text"></span>
        </div>
        <header>
            <div id="logo">
                <a href="index.html"><img src="assets/873547485784.png" alt="IntentSpider"></a>
            </div>
            <div id="nav-area">
                <div class="stats">
                    9 modules, [token count] tokens indexed
                </div>
                <nav>
                    <a href="index.html">Home</a>
                    <a href="playground.html">Playground</a>
                    <a href="paper.html">Paper</a>
                    <a href="about.html">About</a>
                </nav>
            </div>
        </header>

        <main>
            <div class="playground-container">
                <div class="phone-frame">
                    <img class="phone-bg" src="assets/intetnspiderframe-67584.png" alt="Phone">
                    <div class="phone-screen">
                        <div class="app-switcher">
                        <button class="active" id="btn-chat">Chat</button>
                        <button id="btn-search">Search</button>
                    </div>

                    <div class="phone-content" id="chat-content">
                        <div class="message-bubble system">Hello! Type below to test the IntentSpider prediction engine.</div>
                    </div>

                    <div class="keyboard-area">
                        <div class="input-display" id="input-display"></div>
                        
                        <div class="suggestion-bar">
                            <button id="sug-1">—</button>
                            <button id="sug-2">—</button>
                            <button id="sug-3">—</button>
                        </div>

                        <div id="mottie-keyboard-container"></div>
                        <input type="text" id="mottie-hidden-input" style="position: absolute; left: -9999px;">
                    </div>
                </div>
            </div>

                <div style="width: 100%; text-align: left; display: flex; justify-content: center; align-items: flex-start; flex-direction: column; margin-top: 20px;">
                    <h3 style="color: #000; margin-bottom: 5px; font-size: 16px;">Outputs and interactive terminal</h3>
                    <br>
                    <img style="background-color: black;" src="https://emscripten.org/_static/Emscripten_logo_full.svg" width="100px"  alt="">

                    <div class="terminal-panel" id="terminal-panel"></div>
                </div>
            </div>
        </main>

        <footer>
            &copy; 2025 GVMA Research Labs. Contact: [contact placeholder]
        </footer>
    </div>

    <script src="wasm/intentspider.js?v=7"></script>
    <script src="playground.js?v=7"></script>
</body>
</html>
