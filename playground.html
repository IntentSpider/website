<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground - IntentSpider Webnet</title>
    <link rel="icon" href="assets/873547485784.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="top-ribbon"></div>
    <nav>
        <div class="logo-container">
            <a href="index.html">
                <img src="assets/873547485784.png" alt="IntentSpider Logo">
            </a>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="playground.html">Playground</a>
            <a href="paper.html">Paper</a>
            <a href="about.html">About</a>
            <a href="#">GitHub</a>
        </div>
    </nav>

    <div class="playground-container">
        <div id="engine-status" class="status-badge loading">⏳ Loading…</div>
        <div class="phone-frame">
            <div class="phone-notch"></div>
            
            <div class="app-switcher">
                <button class="active" id="btn-chat">💬 Chat</button>
                <button id="btn-search">🔍 Search</button>
            </div>

            <div class="phone-content" id="chat-content">
                <div class="message-bubble system">Hello! Type below to test the IntentSpider prediction engine.</div>
            </div>

            <div class="keyboard-area">
                <div class="input-display" id="input-display"></div>
                
                <div class="suggestion-bar">
                    <button id="sug-1">—</button>
                    <button id="sug-2">—</button>
                    <button id="sug-3">—</button>
                </div>

                <div class="keyboard" id="virtual-keyboard">
                    <div class="keyboard-row">
                        <div class="key" data-key="q">Q</div>
                        <div class="key" data-key="w">W</div>
                        <div class="key" data-key="e">E</div>
                        <div class="key" data-key="r">R</div>
                        <div class="key" data-key="t">T</div>
                        <div class="key" data-key="y">Y</div>
                        <div class="key" data-key="u">U</div>
                        <div class="key" data-key="i">I</div>
                        <div class="key" data-key="o">O</div>
                        <div class="key" data-key="p">P</div>
                    </div>
                    <div class="keyboard-row">
                        <div class="key" data-key="a">A</div>
                        <div class="key" data-key="s">S</div>
                        <div class="key" data-key="d">D</div>
                        <div class="key" data-key="f">F</div>
                        <div class="key" data-key="g">G</div>
                        <div class="key" data-key="h">H</div>
                        <div class="key" data-key="j">J</div>
                        <div class="key" data-key="k">K</div>
                        <div class="key" data-key="l">L</div>
                    </div>
                    <div class="keyboard-row">
                        <div class="key special" data-key="shift">⇧</div>
                        <div class="key" data-key="z">Z</div>
                        <div class="key" data-key="x">X</div>
                        <div class="key" data-key="c">C</div>
                        <div class="key" data-key="v">V</div>
                        <div class="key" data-key="b">B</div>
                        <div class="key" data-key="n">N</div>
                        <div class="key" data-key="m">M</div>
                        <div class="key special" data-key="backspace">⌫</div>
                    </div>
                    <div class="keyboard-row">
                        <div class="key special" data-key="space" style="flex: 4;">SPACE</div>
                        <div class="key special" data-key="enter" style="flex: 2;">⏎</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="terminal-panel" id="terminal-panel">
            <div class="terminal-line info">>> IntentSpider WASM Bridge Initializing...</div>
            <div class="terminal-line info">>> Waiting for engine connection...</div>
        </div>
    </div>

    <script src="wasm/intentspider.js"></script>
    <script src="playground.js"></script>
</body>
</html>
