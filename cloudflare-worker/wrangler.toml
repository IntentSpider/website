name = "intentspider-state-api"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV namespace binding
[[kv_namespaces]]
binding = "STATE_KV"
# REPLACE WITH YOUR ACTUAL KV NAMESPACE ID FROM CLOUDFLARE DASHBOARD
id = "ece31c6c33ff4409b57c8f79566a27fc" 

# Environment variables (set API_KEY via `wrangler secret put API_KEY` or in dashboard)
# Or via GitHub Secrets when deploying automatically

# Custom domain route
# Configure in Cloudflare Dashboard:
#   Workers > intentspider-state-api > Settings > Domains & Routes
#   Add route: projectsapis.nekshadesilva.com/*
