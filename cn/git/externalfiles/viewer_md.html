<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>IntentSpider 文件查看器</title><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script></head><body><div id="content">正在载入文件</div><script>const params=new URLSearchParams(location.search);const file=params.get('file');if(file){fetch(file).then(r=>r.text()).then(t=>{document.getElementById('content').innerHTML=DOMPurify.sanitize(marked.parse(t))}).catch(()=>{document.getElementById('content').textContent='文件载入失败'})}else{document.getElementById('content').textContent='没有指定文件'}</script></body></html>
